worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define NGINX rate limit zone (10MB memory pool, max 10 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=global_ip_limit:10m rate=10r/s;
    limit_req_status 429; # Return HTTP 429 (Too Many Requests) instead of default 503

    ## Upstream block pointing to Docker service names and internal port 8000
    upstream nodejs_cluster {
        keepalive 32;
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;
    }

    # Plain HTTP: serves the Let's Encrypt challenge, redirects everything else to HTTPS
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Proxying requests to Node.js cluster
        location / {
            # Protect Node.js from volumetric bursts
            limit_req zone=global_ip_limit burst=20 nodelay;

            # Enable Docker's embedded DNS server for dynamic IP resolution
            resolver 127.0.0.11 valid=10s ipv6=off;

            proxy_pass http://nodejs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            # REQUIRED FOR EXPRESS TRUST PROXY:
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}