global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m

frontend pg_write_front
    bind *:5000
    default_backend pg_primary_back

backend pg_primary_back
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server db1 db1:5432 maxconn 100 check port 8008
    server db2 db2:5432 maxconn 100 check port 8008
    server db3 db3:5432 maxconn 100 check port 8008

frontend pg_read_front
    bind *:5001
    default_backend pg_replica_back

backend pg_replica_back
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server db1 db1:5432 maxconn 100 check port 8008
    server db2 db2:5432 maxconn 100 check port 8008
    server db3 db3:5432 maxconn 100 check port 8008
