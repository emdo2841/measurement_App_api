name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Dockerfile.dev'
      - 'docker-compose.dev.yaml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x deploy.sh
            ./deploy.sh
